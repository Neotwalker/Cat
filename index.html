<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080a0f" />
  <title>Cursor Cat — Three.js skeletal prototype</title>
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <main class="hero" id="hero">
    <div class="hero__glow hero__glow--one"></div>
    <div class="hero__glow hero__glow--two"></div>

    <section class="hero__copy">
      <p class="hero__kicker">Three.js · custom mesh v2</p>
      <h1 class="hero__title">Теперь он начинает<br />быть похожим.</h1>
      <p class="hero__text">
        Custom Mesh v2: пропорции головы, глаз, груди и передних лап теперь правятся прямо по мобильному сравнению с референсом.
      </p>
      <p class="hero__hint"><span></span><b id="hintText">Двигай мышью · нажми на кота</b></p>
    </section>

    <section class="hero__stage" id="stage" aria-label="Интерактивный 3D-кот">
      <div class="stage__halo"></div>
      <div class="stage__canvas" id="canvasHost"></div>
      <div class="stage__shadow" aria-hidden="true"></div>

      <div class="stage__badge">
        <span class="stage__dot"></span>
        custom mesh v2
      </div>

      <button class="stage__debug" id="debugToggle" type="button" aria-pressed="false">
        Показать скелет
      </button>

      <div class="stage__fallback" id="fallback" hidden>
        WebGL недоступен. CSS-прототип сохранён в ветке <code>css-prototype</code>.
      </div>
    </section>
  </main>

  <script type="module" src="./script.js"></script>
</body>
</html>
